name: Publicar reporte

# El reporte diario (repo fixacar-bots) deja la release como borrador con la llave de Fixacar2014 y avisa aquí.
# Este robot la vuelve a crear con su propia llave (github-actions[bot]): GitHub no le manda correo a una
# cuenta por lo que ella misma publica, así que si la publicara Fixacar2014 el gerente no recibiría el aviso.
on:
  repository_dispatch:
    types: [publicar]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GH_REPO/releases?per_page=30" -q ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -1)
          [ -n "$id" ] || { echo "No hay borrador $TAG"; exit 1; }
          gh api "repos/$GH_REPO/releases/$id" -q .body > notas.md
          titulo=$(gh api "repos/$GH_REPO/releases/$id" -q .name)
          mkdir out
          gh api "repos/$GH_REPO/releases/$id/assets?per_page=100" -q '.[] | "\(.id) \(.name)"' | while read -r aid nombre; do
            gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$aid" > "out/$nombre"
          done
          ls -la out
          gh api -X DELETE "repos/$GH_REPO/releases/$id"
          gh release create "$TAG" out/* --title "$titulo" --notes-file notas.md --latest
